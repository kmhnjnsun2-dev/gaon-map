
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 글쓰기</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .panel, table {
            width: 600px;
            max-width: 100%;
            box-sizing: border-box;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1.5px solid rgb(68, 136, 244);
            border-radius: 5px;
            padding: 8px 10px;
            margin: 5px 0 12px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            height: 38px;
        }

        textarea {
            height: 250px;
            resize: vertical;
        }

        button, input[type="submit"] {
            min-width: 100px;
            height: 38px;
            padding: 0 12px;
            margin: 5px;
            border: 0;
            outline: 1.5px solid rgb(68, 136, 244);
            border-radius: 5px;
            background: rgb(164, 199, 255);
            cursor: pointer;
        }

        button:disabled, input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        h2 { margin-top: 0; }

        .message {
            text-align: center;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .error { color: #d32f2f; }
        .success { color: #16803c; }
        .center { text-align: center; }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- 로그인 및 회원가입 -->
    <div id="authPanel" class="panel" hidden>
        <h2 id="authTitle">로그인</h2>

        <form id="authForm">
            <label for="email">이메일</label>
            <input
                type="email"
                id="email"
                autocomplete="username"
                required
            >

            <label for="password">비밀번호</label>
            <input
                type="password"
                id="password"
                autocomplete="current-password"
                minlength="8"
                required
            >

            <div class="center">
                <button type="submit" id="authSubmit">로그인</button>
                <button type="button" id="toggleAuth">회원가입</button>
            </div>
        </form>

        <p id="authMessage" class="message" role="status"></p>

        <div class="center">
            <button type="button" onclick="location.href='index.html'">
                목록으로
            </button>
        </div>
    </div>


    <!-- 이메일 인증 대기 -->
    <div id="verifyPanel" class="panel" hidden>
        <h2>이메일 인증 필요</h2>

        <p>
            가입한 이메일로 인증 링크를 보냈습니다.
            메일함에서 인증을 완료한 뒤 아래 버튼을 눌러 주세요.
        </p>

        <p id="verifyEmail" class="message"></p>

        <div class="center">
            <button type="button" id="checkVerifyButton">
                인증 확인
            </button>

            <button type="button" id="resendButton">
                인증 메일 재전송
            </button>

            <button type="button" id="verifyLogoutButton">
                로그아웃
            </button>
        </div>

        <p id="verifyMessage" class="message" role="status"></p>
    </div>


    <!-- 글쓰기 -->
    <div id="writePanel" hidden>

        <div class="panel center">
            <span>로그인 및 이메일 인증 완료</span>
            <button type="button" id="logoutButton">
                로그아웃
            </button>
        </div>

        <form id="writeForm">
            <table>
                <tr>
                    <td colspan="2"><h2>글쓰기</h2></td>
                </tr>

                <tr><td><strong>Title</strong></td></tr>
                <tr>
                    <td>
                        <input
                            type="text"
                            id="title"
                            placeholder="제목을 입력하세요"
                            maxlength="100"
                            required
                        >
                    </td>
                </tr>

                <tr><td><strong>Author</strong></td></tr>
                <tr>
                    <td>
                        <input
                            type="text"
                            id="author"
                            placeholder="작성자 이름을 입력하세요"
                            maxlength="30"
                            required
                        >
                    </td>
                </tr>

                <tr><td><strong>Comment</strong></td></tr>
                <tr>
                    <td>
                        <textarea
                            id="detail"
                            placeholder="내용을 입력하세요"
                            maxlength="5000"
                            required
                        ></textarea>
                    </td>
                </tr>

                <tr>
                    <td class="center">
                        <input type="submit" id="submitButton" value="등록">

                        <button
                            type="button"
                            onclick="location.href='index.html'"
                        >
                            취소
                        </button>
                    </td>
                </tr>
            </table>
        </form>

        <p id="writeMessage" class="message" role="status"></p>
    </div>


<script type="module">

    import {
        getApp,
        getApps,
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        sendEmailVerification,
        onAuthStateChanged,
        signOut,
        reload
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    import { firebaseConfig } from "./firebase-config.js";


    const app = getApps().length > 0
        ? getApp()
        : initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    const authPanel = document.getElementById("authPanel");
    const verifyPanel = document.getElementById("verifyPanel");
    const writePanel = document.getElementById("writePanel");

    const authForm = document.getElementById("authForm");
    const writeForm = document.getElementById("writeForm");

    const authTitle = document.getElementById("authTitle");
    const authSubmit = document.getElementById("authSubmit");
    const toggleAuth = document.getElementById("toggleAuth");

    const authMessage = document.getElementById("authMessage");
    const verifyMessage = document.getElementById("verifyMessage");
    const writeMessage = document.getElementById("writeMessage");

    const verifyEmail = document.getElementById("verifyEmail");
    const checkVerifyButton = document.getElementById("checkVerifyButton");
    const resendButton = document.getElementById("resendButton");
    const submitButton = document.getElementById("submitButton");

    let isSignupMode = false;


    function showPanel(panel) {
        authPanel.hidden = true;
        verifyPanel.hidden = true;
        writePanel.hidden = true;

        panel.hidden = false;
    }


    async function updateScreen(user) {

        if (!user) {
            showPanel(authPanel);
            return;
        }

        try {
            await reload(user);
            await user.getIdToken(true);

            if (!user.emailVerified) {
                showPanel(verifyPanel);
                verifyEmail.textContent = user.email || "";
                return;
            }

            showPanel(writePanel);

        } catch (error) {
            console.error("인증 상태 확인 실패:", error);
            showPanel(authPanel);

            authMessage.textContent =
                "계정 상태를 확인하지 못했습니다. 다시 로그인해 주세요.";
        }
    }


    onAuthStateChanged(auth, (user) => {
        updateScreen(user);
    });


    // 로그인 / 회원가입 모드 전환
    toggleAuth.addEventListener("click", () => {

        isSignupMode = !isSignupMode;

        authTitle.textContent = isSignupMode
            ? "회원가입"
            : "로그인";

        authSubmit.textContent = isSignupMode
            ? "가입하기"
            : "로그인";

        toggleAuth.textContent = isSignupMode
            ? "로그인으로 돌아가기"
            : "회원가입";

        authMessage.textContent = "";
        authForm.reset();
    });


    // 로그인 및 회원가입
    authForm.addEventListener("submit", async (e) => {

        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        authSubmit.disabled = true;
        toggleAuth.disabled = true;

        authMessage.textContent = "처리 중...";
        authMessage.className = "message";

        try {

            if (isSignupMode) {

                if (password.length < 8) {
                    throw new Error("비밀번호는 8자 이상이어야 합니다.");
                }

                const credential = await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                await sendEmailVerification(credential.user);

                showPanel(verifyPanel);
                verifyEmail.textContent = email;

                verifyMessage.textContent =
                    "회원가입 완료! 인증 메일을 확인해 주세요.";

                verifyMessage.className = "message success";

            } else {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                await updateScreen(auth.currentUser);

            }

        } catch (error) {

            console.error("인증 처리 실패:", error);

            const messages = {
                "auth/email-already-in-use": "이미 가입된 이메일입니다.",
                "auth/invalid-email": "이메일 형식이 올바르지 않습니다.",
                "auth/weak-password": "비밀번호가 너무 약합니다.",
                "auth/invalid-credential": "이메일 또는 비밀번호가 올바르지 않습니다.",
                "auth/network-request-failed": "네트워크 연결을 확인해 주세요."
            };

            authMessage.textContent =
                error.message.startsWith("비밀번호")
                    ? error.message
                    : messages[error.code] || "요청을 처리하지 못했습니다.";

            authMessage.className = "message error";

        } finally {

            authSubmit.disabled = false;
            toggleAuth.disabled = false;

        }

    });


    // 이메일 인증 확인
    checkVerifyButton.addEventListener("click", async () => {

        const user = auth.currentUser;

        if (!user) {
            showPanel(authPanel);
            return;
        }

        checkVerifyButton.disabled = true;
        verifyMessage.textContent = "인증 상태 확인 중...";

        try {

            await reload(user);
            await user.getIdToken(true);

            if (user.emailVerified) {

                verifyMessage.textContent = "이메일 인증 완료!";
                verifyMessage.className = "message success";

                await updateScreen(user);

            } else {

                verifyMessage.textContent =
                    "아직 인증되지 않았습니다. 이메일의 인증 링크를 눌러 주세요.";

                verifyMessage.className = "message error";

            }

        } catch (error) {

            console.error(error);
            verifyMessage.textContent = "인증 상태 확인에 실패했습니다.";

        } finally {

            checkVerifyButton.disabled = false;

        }

    });


    // 인증 메일 재전송
    resendButton.addEventListener("click", async () => {

        const user = auth.currentUser;

        if (!user) {
            showPanel(authPanel);
            return;
        }

        resendButton.disabled = true;

        try {

            await reload(user);

            if (user.emailVerified) {
                await updateScreen(user);
                return;
            }

            await sendEmailVerification(user);

            verifyMessage.textContent =
                "인증 메일을 다시 보냈습니다. 이메일을 확인해 주세요.";

            verifyMessage.className = "message success";

        } catch (error) {

            console.error(error);

            verifyMessage.textContent =
                "메일 전송에 실패했습니다. 잠시 후 다시 시도해 주세요.";

            verifyMessage.className = "message error";

        } finally {

            resendButton.disabled = false;

        }

    });


    // 로그아웃
    async function logout() {

        try {
            await signOut(auth);
            location.href = "index.html";

        } catch (error) {
            console.error(error);
            alert("로그아웃에 실패했습니다.");
        }

    }

    document.getElementById("logoutButton")
        .addEventListener("click", logout);

    document.getElementById("verifyLogoutButton")
        .addEventListener("click", logout);


    function getTodayString() {

        const today = new Date();

        return (
            String(today.getFullYear()).slice(-2) + "-" +
            String(today.getMonth() + 1).padStart(2, "0") + "-" +
            String(today.getDate()).padStart(2, "0")
        );

    }


    // 게시글 작성
    writeForm.addEventListener("submit", async (e) => {

        e.preventDefault();

        const user = auth.currentUser;

        if (!user) {
            alert("로그인이 필요합니다.");
            showPanel(authPanel);
            return;
        }

        submitButton.disabled = true;

        try {

            await reload(user);
            await user.getIdToken(true);

            if (!user.emailVerified) {
                alert("이메일 인증을 완료해야 글을 작성할 수 있습니다.");
                showPanel(verifyPanel);
                return;
            }

            const title = document.getElementById("title").value.trim();
            const author = document.getElementById("author").value.trim();
            const detail = document.getElementById("detail").value.trim();

            if (!title || !author || !detail) {
                alert("모든 항목을 입력해 주세요.");
                return;
            }

            if (
                title.length > 100 ||
                author.length > 30 ||
                detail.length > 5000
            ) {
                alert("입력 가능한 글자 수를 초과했습니다.");
                return;
            }

            writeMessage.textContent = "게시글 저장 중...";
            writeMessage.className = "message";

            await addDoc(collection(db, "posts"), {
                title: title,
                author: author,
                detail: detail,
                date: getTodayString(),
                createdAt: serverTimestamp(),
                uid: user.uid
            });

            alert("게시글이 등록되었습니다.");
            location.href = "index.html";

        } catch (error) {

            console.error("게시글 저장 실패:", error);

            writeMessage.textContent =
                "게시글 등록에 실패했습니다. 로그인 상태와 Firebase 규칙을 확인해 주세요.";

            writeMessage.className = "message error";

        } finally {

            submitButton.disabled = false;

        }

    });

</script>

</body>
</html>
