
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        table {
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea {
            border: 1.5px rgb(68, 136, 244) solid;
            width: 500px;
            max-width: 100%;
            border-radius: 5px;
            padding: 8px 10px;
            box-sizing: border-box;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            height: 35px;
        }

        textarea {
            height: 300px;
            resize: vertical;
        }

        .header {
            height: 30px;
            font-weight: bold;
        }

        input[type="submit"],
        input[type="button"],
        button {
            min-width: 100px;
            height: 35px;
            font-size: 14px;
            border: 0;
            outline: 1.5px rgb(68, 136, 244) solid;
            border-radius: 5px;
            background-color: rgb(164, 199, 255);
            cursor: pointer;
            margin-right: 5px;
            padding: 0 12px;
        }

        button:disabled,
        input[type="submit"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin: 15px;
            color: #333;
        }

        .error {
            color: #d32f2f;
        }

        .success {
            color: #16803c;
        }

        .panel {
            text-align: center;
        }

        .logout-area {
            text-align: center;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            table {
                width: 100%;
                padding: 12px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            textarea {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- 로그인 화면 -->
<div id="loginPanel" class="panel" hidden>
    <form id="loginForm">
        <table>
            <tr>
                <td colspan="2">
                    <h2>관리자 로그인</h2>
                </td>
            </tr>

            <tr>
                <td class="header">이메일</td>
            </tr>

            <tr>
                <td>
                    <input
                        type="email"
                        id="email"
                        placeholder="관리자 이메일"
                        autocomplete="username"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td class="header">비밀번호</td>
            </tr>

            <tr>
                <td>
                    <input
                        type="password"
                        id="password"
                        placeholder="비밀번호"
                        autocomplete="current-password"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td style="padding-top: 15px;">
                    <input type="submit" id="loginButton" value="로그인">
                    <input
                        type="button"
                        value="취소"
                        onclick="location.href='index.html'"
                    >
                </td>
            </tr>
        </table>
    </form>

    <p id="loginMessage" class="message" role="status"></p>
</div>


<!-- 관리자 권한이 없는 계정 -->
<div id="deniedPanel" class="panel" hidden>
    <h2>접근 권한 없음</h2>
    <p>관리자 계정으로 로그인해야 합니다.</p>

    <button type="button" id="logoutButton">
        로그아웃
    </button>

    <button
        type="button"
        onclick="location.href='index.html'"
    >
        돌아가기
    </button>
</div>


<!-- 글쓰기 화면 -->
<div id="writePanel" hidden>

    <div class="logout-area">
        <span>관리자 로그인 상태</span>
        <button type="button" id="writeLogoutButton">
            로그아웃
        </button>
    </div>

    <form id="writeForm">

        <table>
            <tr>
                <td colspan="2">
                    <h2>글쓰기</h2>
                </td>
            </tr>

            <tr>
                <td class="header">Title</td>
            </tr>

            <tr>
                <td>
                    <input
                        type="text"
                        id="title"
                        placeholder="제목을 입력하세요"
                        maxlength="100"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td class="header">Author</td>
            </tr>

            <tr>
                <td>
                    <input
                        type="text"
                        id="author"
                        placeholder="작성자 이름을 입력하세요"
                        maxlength="30"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td class="header">Comment</td>
            </tr>

            <tr>
                <td>
                    <textarea
                        id="detail"
                        placeholder="내용을 입력하세요"
                        maxlength="5000"
                        required
                    ></textarea>
                </td>
            </tr>

            <tr>
                <td style="padding-top: 15px;">
                    <input
                        type="submit"
                        id="submitButton"
                        value="등록"
                    >

                    <input
                        type="button"
                        value="취소"
                        onclick="location.href='index.html'"
                    >
                </td>
            </tr>
        </table>

    </form>

    <p id="writeMessage" class="message" role="status"></p>

</div>


<script type="module">

    import {
        getApp,
        getApps,
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    import {
        firebaseConfig
    } from "./firebase-config.js";


    // Firebase 초기화
    const app = getApps().length > 0
        ? getApp()
        : initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    // 관리자 UID
    const ADMIN_UID = "nFEHK0hHcngxC6kEiXVywxFiYPr2";


    // 화면 요소
    const loginPanel = document.getElementById("loginPanel");
    const deniedPanel = document.getElementById("deniedPanel");
    const writePanel = document.getElementById("writePanel");

    const loginForm = document.getElementById("loginForm");
    const writeForm = document.getElementById("writeForm");

    const loginMessage = document.getElementById("loginMessage");
    const writeMessage = document.getElementById("writeMessage");

    const loginButton = document.getElementById("loginButton");
    const submitButton = document.getElementById("submitButton");


    // 로그인 상태에 따른 화면 표시
    onAuthStateChanged(auth, (user) => {

        loginPanel.hidden = true;
        deniedPanel.hidden = true;
        writePanel.hidden = true;

        if (!user) {
            loginPanel.hidden = false;
            return;
        }

        if (user.uid === ADMIN_UID) {
            writePanel.hidden = false;
        } else {
            deniedPanel.hidden = false;
        }

    });


    // 로그인 처리
    loginForm.addEventListener("submit", async (e) => {

        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        loginButton.disabled = true;
        loginMessage.textContent = "로그인 확인 중...";
        loginMessage.className = "message";

        try {

            const credential = await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            if (credential.user.uid !== ADMIN_UID) {

                await signOut(auth);

                loginMessage.textContent =
                    "관리자 권한이 없는 계정입니다.";

                loginMessage.className = "message error";
            }

        } catch (error) {

            console.error("로그인 실패:", error);

            loginMessage.textContent =
                "로그인에 실패했습니다. 이메일과 비밀번호를 확인하세요.";

            loginMessage.className = "message error";

        } finally {

            loginButton.disabled = false;

        }

    });


    // 로그아웃
    async function logout() {

        try {

            await signOut(auth);
            location.href = "index.html";

        } catch (error) {

            console.error("로그아웃 실패:", error);
            alert("로그아웃에 실패했습니다.");

        }

    }

    document.getElementById("logoutButton")
        .addEventListener("click", logout);

    document.getElementById("writeLogoutButton")
        .addEventListener("click", logout);


    // 날짜 생성
    function getTodayString() {

        const today = new Date();

        return (
            String(today.getFullYear()).slice(-2) + "-" +
            String(today.getMonth() + 1).padStart(2, "0") + "-" +
            String(today.getDate()).padStart(2, "0")
        );

    }


    // 게시글 등록
    writeForm.addEventListener("submit", async (e) => {

        e.preventDefault();

        const user = auth.currentUser;

        // 관리자 UID 재확인
        if (!user || user.uid !== ADMIN_UID) {

            alert("관리자만 게시글을 작성할 수 있습니다.");
            return;

        }

        const title = document.getElementById("title").value.trim();
        const author = document.getElementById("author").value.trim();
        const detail = document.getElementById("detail").value.trim();

        // 입력값 검사
        if (!title || !author || !detail) {

            alert("모든 항목을 입력해 주세요.");
            return;

        }

        if (title.length > 100 || author.length > 30 || detail.length > 5000) {

            alert("입력 가능한 글자 수를 초과했습니다.");
            return;

        }

        submitButton.disabled = true;
        writeMessage.textContent = "게시글 저장 중...";
        writeMessage.className = "message";

        try {

            await addDoc(collection(db, "posts"), {

                title: title,
                author: author,
                detail: detail,
                date: getTodayString(),
                createdAt: serverTimestamp()

            });

            alert("작성 완료!");

            location.href = "index.html";

        } catch (error) {

            console.error("글 저장 실패:", error);

            writeMessage.textContent =
                "글 저장에 실패했습니다. Firebase 권한 설정을 확인하세요.";

            writeMessage.className = "message error";

        } finally {

            submitButton.disabled = false;

        }

    });

</script>

</body>
</html>
