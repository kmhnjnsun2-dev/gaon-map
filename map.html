    <!-- 기존 지도 동작 스크립트 -->

    <!-- 게시판 영역 -->
    <div class="board-container">
        <h2>게시판</h2>
        <table class="table" id="boardTable">
            <thead>
                <tr class="header">
                    <th class="num">번호</th>
                    <th class="board-title">제목</th>
                    <th class="author">작성자</th>
                    <th class="date">작성날짜</th>
                </tr>
            </thead>
            <tbody id="boardBody">
            </tbody>
        </table>

        <div class="button-area">
            <button onclick="location.href='write.html'">글쓰기</button>
        </div>
    </div>

    <!-- Firebase 데이터베이스 연동 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVbp-_5KdDynXCSqgC6Fes2EmpjKTD2Mk",
            authDomain: "gaon-map-db.firebaseapp.com",
            projectId: "gaon-map-db",
            storageBucket: "gaon-map-db.firebasestorage.app",
            messagingSenderId: "433762115709",
            appId: "1:433762115709:web:0f931e8828614b1ca5d114",
            measurementId: "G-0WT6P1M3ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadBoard() {
            const boardBody = document.getElementById('boardBody');
            if (!boardBody) return;
            boardBody.innerHTML = '';

            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    boardBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 15px;">등록된 게시물이 없습니다.</td></tr>`;
                    return;
                }

                let totalCount = querySnapshot.size;
                let index = 0;

                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    const row = document.createElement('tr');
                    row.className = 'body';
                    row.innerHTML = `
                        <td class="num">${totalCount - index}</td>
                        <td class="board-title"><a href="detail.html?id=${doc.id}">${post.title}</a></td>
                        <td class="author">${post.author}</td>
                        <td class="date">${post.date}</td>
                    `;
                    boardBody.appendChild(row);
                    index++;
                });
            } catch (error) {
                console.error("데이터 불러오기 실패:", error);
            }
        }

        window.onload = function() {
            if (typeof showFloor === 'function') {
                showFloor(1);
            }
            loadBoard();
        };
    </script>
</body>
