<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글 상세보기</title>
<style>
    body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px; }
    .container {
        width: 600px;
        margin: 40px auto;
        background-color: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 { border-bottom: 2px solid rgb(68, 136, 244); padding-bottom: 10px; margin-top: 0; }
    .info { color: #666; font-size: 14px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    .content { min-height: 200px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    .btn-area { text-align: right; margin-top: 20px; }
    button {
        width: 100px;
        height: 35px;
        font-size: 14px;
        border: 0;
        outline: 1.5px rgb(68, 136, 244) solid;
        border-radius: 5px;
        background-color: rgb(164, 199, 255);
        cursor: pointer;
        margin-left: 5px;
    }
    button.delete-btn {
        outline: 1.5px rgb(244, 68, 68) solid;
        background-color: rgb(255, 180, 180);
    }
</style>
</head>
<body>

<div class="container">
    <h2 id="postTitle">제목 불러오는 중...</h2>
    <div class="info">
        작성자: <span id="postAuthor">-</span> | 작성일: <span id="postDate">-</span>
    </div>
    <div class="content" id="postContent">내용을 불러오는 중입니다...</div>

    <div class="btn-area">
        <button class="delete-btn" id="deleteBtn">삭제하기</button>
        <button onclick="location.href='index.html'">목록으로</button>
    </div>
</div>

<script type="module">
    import { getApp, getApps, initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    async function loadPost() {
        if (!postId) {
            alert('잘못된 접근입니다.');
            location.href = 'index.html';
            return;
        }

        try {
            const docRef = doc(db, "posts", postId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const currentPost = docSnap.data();
                document.getElementById('postTitle').innerText = currentPost.title;
                document.getElementById('postAuthor').innerText = currentPost.author;
                document.getElementById('postDate').innerText = currentPost.date;
                document.getElementById('postContent').innerText = currentPost.detail;
            } else {
                alert('존재하지 않는 게시물입니다.');
                location.href = 'index.html';
            }
        } catch (error) {
            console.error("데이터 로드 실패:", error);
        }
    }

    function deletePost() {
        alert("게시글 삭제 기능은 현재 관리자 페이지/콘솔을 통해서만 지원됩니다.");
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadPost();
        const deleteBtn = document.getElementById('deleteBtn');
        if (deleteBtn) {
            deleteBtn.addEventListener('click', deletePost);
        }
    });
</script>

</body>
</html>
