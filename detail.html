
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 상세보기</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 600px;
            max-width: 100%;
            box-sizing: border-box;
            margin: 40px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            border-bottom: 2px solid rgb(68, 136, 244);
            padding-bottom: 10px;
            margin-top: 0;
            overflow-wrap: anywhere;
        }

        .info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .content {
            min-height: 200px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .btn-area {
            text-align: right;
            margin-top: 20px;
        }

        button {
            width: 100px;
            height: 35px;
            font-size: 14px;
            border: 0;
            outline: 1.5px rgb(68, 136, 244) solid;
            border-radius: 5px;
            background-color: rgb(164, 199, 255);
            cursor: pointer;
            margin-left: 5px;
        }

        button.delete-btn {
            outline: 1.5px rgb(244, 68, 68) solid;
            background-color: rgb(255, 180, 180);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #statusMessage {
            text-align: center;
            color: #666;
            margin-top: 15px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px auto;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2 id="postTitle">제목 불러오는 중...</h2>

    <div class="info">
        작성자: <span id="postAuthor">-</span>
        |
        작성일: <span id="postDate">-</span>
    </div>

    <div class="content" id="postContent">
        내용을 불러오는 중입니다...
    </div>

    <div class="btn-area">

        <button
            class="delete-btn"
            id="deleteBtn"
            type="button"
            hidden
            disabled
        >
            삭제하기
        </button>

        <button id="listBtn" type="button">
            목록으로
        </button>

    </div>

    <p id="statusMessage" role="status"></p>

</div>


<script type="module">

    import {
        getApp,
        getApps,
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        reload
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    import {
        firebaseConfig
    } from "./firebase-config.js";


    // Firebase 초기화
    const app = getApps().length > 0
        ? getApp()
        : initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    // 관리자 UID
    const ADMIN_UID = "nFEHK0hHcngxC6kEiXVywxFiYPr2";


    // 게시글 ID
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get("id");


    // 화면 요소
    const postTitle = document.getElementById("postTitle");
    const postAuthor = document.getElementById("postAuthor");
    const postDate = document.getElementById("postDate");
    const postContent = document.getElementById("postContent");

    const deleteBtn = document.getElementById("deleteBtn");
    const listBtn = document.getElementById("listBtn");
    const statusMessage = document.getElementById("statusMessage");


    let postRef = null;


    // 목록으로 이동
    listBtn.addEventListener("click", () => {
        location.href = "index.html";
    });


    // 게시글 불러오기
    async function loadPost() {

        if (!postId || postId.trim() === "") {
            alert("잘못된 접근입니다.");
            location.href = "index.html";
            return;
        }

        try {

            postRef = doc(db, "posts", postId);

            const docSnap = await getDoc(postRef);

            if (!docSnap.exists()) {

                alert("존재하지 않는 게시물입니다.");
                location.href = "index.html";
                return;

            }

            const currentPost = docSnap.data();

            // 사용자 입력 데이터는 HTML이 아닌 텍스트로 출력
            postTitle.textContent = String(currentPost.title ?? "");
            postAuthor.textContent = String(currentPost.author ?? "");
            postDate.textContent = String(currentPost.date ?? "");
            postContent.textContent = String(currentPost.detail ?? "");

        } catch (error) {

            console.error("데이터 로드 실패:", error);

            postTitle.textContent = "게시글을 불러오지 못했습니다.";
            postContent.textContent =
                "데이터를 불러오는 중 오류가 발생했습니다.";

            statusMessage.textContent =
                "Firebase 연결 및 권한 설정을 확인해 주세요.";

        }

    }


    // 관리자 여부 확인
    onAuthStateChanged(auth, async (user) => {

        deleteBtn.hidden = true;
        deleteBtn.disabled = true;

        if (!user) return;

        try {

            await reload(user);
            await user.getIdToken(true);

            const isAdmin =
                user.uid === ADMIN_UID &&
                user.emailVerified === true;

            if (isAdmin) {
                deleteBtn.hidden = false;
                deleteBtn.disabled = false;
            }

        } catch (error) {

            console.error("관리자 확인 실패:", error);

        }

    });


    // 게시글 삭제
    async function deletePost() {

        const user = auth.currentUser;

        if (!user) {
            alert("관리자 로그인이 필요합니다.");
            return;
        }

        try {

            await reload(user);
            await user.getIdToken(true);

            if (
                user.uid !== ADMIN_UID ||
                user.emailVerified !== true
            ) {
                alert("관리자만 게시글을 삭제할 수 있습니다.");
                return;
            }

            if (!postRef) {
                alert("게시글 정보가 아직 준비되지 않았습니다.");
                return;
            }

            const confirmed = confirm(
                "정말 이 게시글을 삭제하시겠습니까?\n삭제한 게시글은 복구할 수 없습니다."
            );

            if (!confirmed) return;

            deleteBtn.disabled = true;
            statusMessage.textContent = "게시글 삭제 중...";

            await deleteDoc(postRef);

            alert("게시글이 삭제되었습니다.");
            location.href = "index.html";

        } catch (error) {

            console.error("게시글 삭제 실패:", error);

            statusMessage.textContent =
                "삭제에 실패했습니다. 관리자 권한과 Firebase 규칙을 확인해 주세요.";

            deleteBtn.disabled = false;

        }

    }


    deleteBtn.addEventListener("click", deletePost);


    // 페이지 시작
    loadPost();

</script>

</body>
</html>
